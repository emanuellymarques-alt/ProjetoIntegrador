<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
     <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Ícones do Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="estilo.css">
    <link rel="stylesheet" href="estilo2.css">

    <link href="/website/css/uicons-" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        a {
            text-decoration: none;
        }

        .body {
            background-color: #F7EFE9;
        }

        .cent {
            text-align: right;
        }

        body {
            background-color: #F7EFE9;
            margin: 0;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
            background: #F7EFE9;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .08);
            padding: 15px 50px;
        }

        /*cor fundo*/
        .menu {
            display: flex;
            gap: 30px;
            background-color: #F7EFE9;
            align-items: center;
        }

        /*escrita das páginas*/
        .menu a {
            color: #000;
            font-family: 'Times New Roman', Times, serif;
            font-weight: 500;
            /* ou 500 */
            font-size: 15px;

        }

        /*escrita das páginas*/
        .menu a:hover {
            color: #8B3E4d;
            transform: scale(1.15);
        }

        /*img dos icones*/
        .menu img {
            width: 24px;
            height: auto;
            cursor: pointer;
            transition: 0.3s;
        }

        /* HOVER DOS ÍCONES */
        .menu img:hover {
            color: #8B3E4d;
            transform: scale(1.15);
        }

        .logo {
            width: 200px;
            /* ajuste entre 200 e 280px */
            height: auto;
        }



     .pesquisa{
    display: flex;
    align-items: center;
    gap: 8px;
}

#campoPesquisa{
    display: none;
    width: 180px;
    height: 36px;
    padding: 0 12px;
    border: 2px solid #222;
    border-radius: 20px;
    font-family: 'Times New Roman', Times, serif;
    
}



#btnPesquisa{
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 0;
}

#btnPesquisa img{
    width: 30px;
    height: 30px;
}
    </style>
</head>
    <body class="body">

    <header class="header">

        <a href="index02.html">
            <img src="img/logo_floricultura-removebg-preview.png" class="logo" alt="Logo">
        </a>
        <nav class="menu">
            <a href="index02.html">HOME</a>
            <a href="categorias2.html">CATEGORIAS</a>
            <a href="significado2.html">SIGNIFICADO DAS FLORES</a>
            <a href="depoimento2.html">DEPOIMENTOS</a>
            <a href="sobrenós2.html">SOBRE NÓS</a>
            <div class="pesquisa">
    <button id="btnPesquisa" type="button">
        <img src="img/lupaIcon.png" alt="Pesquisar">
    </button>

    <input type="text"  id="campoPesquisa" placeholder="Pesquisar flores...">
</div>
            
        </nav>
    </header>
    <!-- Botão Flutuante do Carrinho -->
    <button id="btn-carrinho-flutuante" class="cart-float-btn" type="button" data-bs-toggle="offcanvas"
        data-bs-target="#carrinhoOffcanvas">
        <i class="bi bi-cart-fill fs-3"></i>
        <span id="cart-count"
            class="position-absolute top-0 start-100 translate-middle badge rounded-pill badge-ef fs-6">
            0
        </span>
    </button>
 
    <section>
       

        </div>
    </section>

    <section>
        <!-- Catálogo de Produtos -->
        <div class="container my-3">
         

            <!-- Estrutura do Carrossel -->
            <div id="carrosselProdutos" class="carousel slide" data-bs-ride="false">
                <div class="carousel-inner" id="produtos-container">
                    <!-- Os slides com 4 cards cada serão injetados aqui via JS -->
                </div>

                <!-- Botão Anterior -->
                <button class="carousel-control-prev" type="button" data-bs-target="#carrosselProdutos"
                    data-bs-slide="prev" style="width: 5%; justify-content: start;">
                    <span class="carousel-control-prev-icon bg-dark rounded-circle p-3" aria-hidden="true"></span>
                    <span class="visually-hidden">Anterior</span>
                </button>

                <!-- Botão Próximo -->
                <button class="carousel-control-next" type="button" data-bs-target="#carrosselProdutos"
                    data-bs-slide="next" style="width: 5%; justify-content: end;">
                    <span class="carousel-control-next-icon bg-dark rounded-circle p-3" aria-hidden="true"></span>
                    <span class="visually-hidden">Próximo</span>
                </button>
            </div>
        </div>
    </section>

   

    <!-- Offcanvas do Carrinho -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="carrinhoOffcanvas" style="min-width: 350px;">
        <div class="offcanvas-header offcanvas-header-ef">
            <h5 class="offcanvas-title fw-bold"><i class="bi bi-bag-heart me-2"></i>Seu Carrinho</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body offcanvas-body-ef d-flex flex-column">

            <!-- Lista de itens do carrinho -->
            <ul class="list-group list-group-flush flex-grow-1 overflow-auto mb-3" id="cart-items">
                <li class="list-group-item text-center text-muted py-4 bg-transparent border-0">Seu carrinho está vazio.
                </li>
            </ul>

            <!-- Seção de Desconto e Total -->
            <div class="border-top border-secondary-subtle pt-3 mt-auto">

                <!-- Campo de Cupom de Desconto -->
                <div class="mb-3">
                    <label for="cupom-input" class="form-label small fw-bold text-dark">Cupom de Desconto:</label>
                    <div class="input-group">
                        <input type="text" id="cupom-input" class="form-control" placeholder="Ex: FLORES10">
                        <button class="btn btn-ef" type="button" onclick="aplicarCupom()">Aplicar</button>
                    </div>
                    <small id="cupom-mensagem" class="form-text"></small>
                </div>

                <!-- Resumo de Valores -->
                <div class="d-flex justify-content-between align-items-center mb-1 text-dark">
                    <span>Subtotal:</span>
                    <span class="fw-bold" id="cart-subtotal">R$ 0,00</span>
                </div>
                <div class="d-flex justify-content-between align-items-center mb-2 text-danger" id="linha-desconto"
                    style="display: none !important;">
                    <small id="nome-desconto">Desconto:</small>
                    <small class="fw-bold" id="cart-desconto">- R$ 0,00</small>
                </div>
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <span class="fw-bold fs-5 text-dark">Total:</span>
                    <span class="fw-bold fs-4" style="color: #81040a;" id="cart-total">R$ 0,00</span>
                </div>

                <button class="btn btn-ef w-100 btn-lg" onclick="finalizarCompra()">Finalizar Compra</button>
            </div>
        </div>  
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Lógica do Carrinho -->
    <script type="text/javascript" src="script.js"></script>
    <script>
const btn = document.getElementById("btnPesquisa");
const campo = document.getElementById("campoPesquisa");

btn.onclick = function () {
    if (campo.style.display === "block") {
        campo.style.display = "none";
    } else {
        campo.style.display = "block";
        campo.focus();
    }
};
</script>

</body>
</html>
