/* Efeito de Hover nos Cards */
.card {
    border-radius: 15px;
    overflow: hidden;
    width: 70%;
    /* Adicione a linha abaixo para suavizar o movimento */
    transition: transform 0.3s ease, box-shadow 0.3s ease; 
}

/* O que acontece quando passa o mouse no card */
.card:hover {
    transform: translateY(-10px); /* Faz o card subir um pouco */
    cursor: pointer; /* Transforma a seta do mouse na mãozinha de clique */
}

/* Opcional: Faz o texto do card mudar para a cor do seu tema no hover */
.card:hover .h5 {
    color: #8B3E4d; 
    transition: color 0.3s ease;
}

/* Força todas as imagens dos cards a terem o mesmo tamanho e proporção */
.card-img-top {
    height: 300px;         /* Define uma altura fixa igual para todas */
    object-fit: cover;     /* Corta as sobras das imagens sem distorcer ou amassar */
    object-position: center; /* Centraliza o foco do corte na foto */
    width: 100%;           /* Garante que ela ocupe toda a largura do card */
}

                    const btn = document.getElementById("btnPesquisa");
                    const campo = document.getElementById("campoPesquisa");

                        if (campo.style.display === "block") {

                        } else {
